name: Recover stalled Facebook monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Cancel monitor runs stalled for more than 8 minutes
        uses: actions/github-script@v8
        with:
          script: |
            const staleBefore = Date.now() - (8 * 60 * 1000);
            const activeStatuses = ["queued", "in_progress", "pending"];
            const runsById = new Map();

            for (const status of activeStatuses) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "monitor.yml",
                status,
                per_page: 100,
              });

              for (const run of response.data.workflow_runs) {
                runsById.set(run.id, run);
              }
            }

            const staleRuns = [...runsById.values()].filter((run) => {
              const started = Date.parse(run.run_started_at || run.created_at);
              return Number.isFinite(started) && started < staleBefore;
            });

            if (staleRuns.length === 0) {
              core.info("No stalled monitor runs found.");
              return;
            }

            for (const run of staleRuns) {
              core.warning(
                `Canceling stalled monitor run #${run.run_number} (${run.status})`,
              );
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
              } catch (error) {
                if (error.status === 409) {
                  core.info(`Run #${run.run_number} already finished.`);
                  continue;
                }
                throw error;
              }
            }
