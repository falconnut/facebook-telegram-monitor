name: Monitor Facebook and notify Telegram

on:
  workflow_dispatch:
    inputs:
      send_test:
        description: Send a Telegram test notification
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: facebook-telegram-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check for new posts
        env:
          FB_PAGE_URL: https://www.facebook.com/people/Golfclub-by-benz/100083124501694/
          BROWSER_CHANNEL: chrome
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_NOTIFICATION: ${{ inputs.send_test == true && '1' || '0' }}
        run: npm run monitor

      - name: Save monitoring state
        if: success()
        run: |
          if git diff --quiet -- data/state.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "chore: update Facebook monitor state"
          git push

      - name: Upload debug screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: facebook-debug
          path: debug-facebook*.png
          if-no-files-found: ignore
          retention-days: 3
